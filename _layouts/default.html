<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>
    {% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}
  </title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <div class="site-shell">
    <aside class="sidebar">
      <div class="sidebar-inner">
        <div class="sidebar-top">
          {% if site.top_logo %}
            <div class="sidebar-logo sidebar-logo-top">
              <img src="{{ site.top_logo | relative_url }}" alt="Site logo">
            </div>
          {% endif %}

          <div class="site-brand">
            <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
            <p>{{ site.description }}</p>
          </div>

          <nav class="sidebar-nav" aria-label="Main navigation">
            {% for item in site.data.navigation %}
              <a
                href="{{ item.url | relative_url }}"
                class="{% if page.url == item.url %}active{% endif %}">
                {{ item.title }}
              </a>
            {% endfor %}
          </nav>
        </div>

        {% if site.bottom_logo %}
          <div class="sidebar-bottom">
            <div class="sidebar-logo sidebar-logo-bottom">
              <img src="{{ site.bottom_logo | relative_url }}" alt="Footer logo">
            </div>
          </div>
        {% endif %}
      </div>
    </aside>

    <main class="content">
      {{ content }}
    </main>
  </div>
</body>
</html>
